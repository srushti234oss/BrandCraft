databases:
  - name: brandcraft-db
    databaseName: brandcraft
    user: brandcraft
    plan: free

services:
  - type: web
    name: brandcraft
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandcraft-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: AI_MODE
        value: mock
